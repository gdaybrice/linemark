  <body class="bg-gh-bg text-gh-text font-sans">
    <div id="app"></div>

    <script>
      (function () {
        const bootstrap = window.__BOOTSTRAP__;
        const app = document.getElementById("app");
        let currentDiffData = null;
        let commits = [];

        function esc(s) {
          return s
            .replace(/&/g, "&amp;")
            .replace(/</g, "&lt;")
            .replace(/>/g, "&gt;")
            .replace(/"/g, "&quot;");
        }

        if (!bootstrap) {
          app.innerHTML = `<div class="flex items-center justify-center min-h-screen">
              <div class="text-center">
                <div class="w-8 h-8 border border-gh-border mx-auto mb-4 flex items-center justify-center">
                  <svg class="w-4 h-4 text-gh-muted" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M15 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7Z"/><path d="M14 2v4a2 2 0 0 0 2 2h4"/></svg>
                </div>
                <p class="text-[13px] text-gh-text font-medium">No changes to review</p>
              </div>
            </div>`;
          return;
        }

        let annotations = new Map();
        let submitted = false;
        let viewMode = "split";

        function renderEndScreen(message, dimmed) {
          return `<div class="flex items-center justify-center min-h-screen">
            <div class="text-center">
              <svg class="mx-auto mb-5${dimmed ? " opacity-40" : ""}" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="48" height="48">
                <rect fill="var(--color-bg)" width="32" height="32" rx="7"/>
                <rect fill="var(--color-subtle)" x="12" y="6" width="14" height="3" rx="1"/>
                <rect fill="var(--color-diff-del-fg)" x="6" y="12" width="3" height="3" rx="1"/>
                <rect fill="var(--color-del-word)" x="12" y="12" width="14" height="3" rx="1"/>
                <rect fill="var(--color-diff-add-fg)" x="6" y="18" width="3" height="3" rx="1"/>
                <rect fill="var(--color-ins-word)" x="12" y="18" width="14" height="3" rx="1"/>
                <rect fill="var(--color-subtle)" x="12" y="24" width="10" height="3" rx="1"/>
              </svg>
              <p class="text-[13px] text-gh-text font-medium">${message}</p>
              <p class="text-[11px] text-gh-muted mt-1">You can close this tab</p>
            </div>
          </div>`;
        }

        const viewedFiles = new Set();

        function setViewed(fileName, viewed) {
          if (viewed) {
            viewedFiles.add(fileName);
          } else {
            viewedFiles.delete(fileName);
          }
          updateViewedCount();
          const treeEl = document.querySelector(`[data-tree-file="${CSS.escape(fileName)}"]`);
          if (treeEl) {
            treeEl.className = treeEl.className.replace(
              /text-gh-(text|muted)/,
              viewed ? "text-gh-muted" : "text-gh-text",
            );
            const existing = treeEl.querySelector(".viewed-check");
            if (viewed && !existing) {
              const check = document.createElement("svg");
              check.className = "w-3 h-3 text-gh-addFg shrink-0 viewed-check";
              check.setAttribute("viewBox", "0 0 24 24");
              check.setAttribute("fill", "none");
              check.setAttribute("stroke", "currentColor");
              check.setAttribute("stroke-width", "2");
              check.setAttribute("stroke-linecap", "round");
              check.setAttribute("stroke-linejoin", "round");
              check.innerHTML = '<path d="M20 6 9 17l-5-5"/>';
              treeEl.appendChild(check);
            } else if (!viewed && existing) {
              existing.remove();
            }
          }
        }

        function updateViewedCount() {
          // Viewed state persists across selection changes, so only count files that
          // are actually in the current diff.
          const visible = [...viewedFiles].filter((f) => fileStats.has(f)).length;
          const el = document.getElementById("viewed-count");
          if (el) el.textContent = `${visible} / ${fileStats.size} viewed`;
        }

        // Which commits (and whether the working tree) are part of the reviewed diff.
        let selectedCommits = new Set();
        let worktreeSelected = false;
        let selectionFetchId = 0;
        let selectionDebounce = null;

        // Human-readable summary of what's checked, e.g. "3 commits + working tree".
        function selectionLabel() {
          const n = selectedCommits.size;
          const parts = [];
          if (n) parts.push(`${n} commit${n !== 1 ? "s" : ""}`);
          if (worktreeSelected) parts.push("working tree");
          return parts.length ? parts.join(" + ") : "Nothing selected";
        }

        function selectionQuery() {
          let q = `/api/diff?commits=${[...selectedCommits].map(encodeURIComponent).join(",")}`;
          if (worktreeSelected) q += "&worktree=1";
          return q;
        }

        // The problem is rapid checkbox toggling would fire a re-render per click and
        // a slow older response could clobber a newer one.
        // The way we solve this is with a short debounce plus a fetch id so only the
        // latest response gets rendered.
        // flow: Commits pane toggle -> scheduleSelectionFetch -> fetchSelectionDiff() <-- HERE
        function fetchSelectionDiff() {
          const myId = ++selectionFetchId;
          return fetch(selectionQuery())
            .then((r) => r.json())
            .then((data) => {
              if (myId !== selectionFetchId) return;
              renderDiffView(data);
            })
            .catch(() => {
              const target = document.getElementById("diff-target") || app;
              target.innerHTML = `<div class="flex items-center justify-center py-20"><div class="text-[13px] text-gh-delFg">Failed to load diff</div></div>`;
            });
        }

        function scheduleSelectionFetch() {
          clearTimeout(selectionDebounce);
          selectionDebounce = setTimeout(fetchSelectionDiff, 250);
        }

        const INFO_ICON =
          '<svg class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4"/><path d="M12 8h.01"/></svg>';

        // The problem is commit rows only have room for the first line of the message,
        // but review context often lives in the body.
        // The way we solve this is with a modal overlay showing the full message, opened
        // by Enter on a focused row or its info button, closed by Esc / backdrop / X.
        // flow: Commits pane row — user hits Enter (or clicks info) on a commit
        function openCommitModal(hash) {
          const c = commits.find((x) => x.hash === hash);
          if (!c) return;
          const overlay = document.createElement("div");
          overlay.className = "fixed inset-0 z-[300] flex items-center justify-center p-6";
          overlay.style.background = "rgba(0, 0, 0, 0.5)";
          overlay.innerHTML = `
            <div class="bg-gh-surface border border-gh-border max-w-[600px] w-full max-h-[70vh] flex flex-col">
              <div class="flex items-center gap-3 px-4 py-3 border-b border-gh-border">
                <span class="font-mono text-[12px] text-gh-text bg-gh-badgeBg border border-gh-border px-2 py-0.5">${esc(c.shortHash)}</span>
                <span class="text-[12px] text-gh-muted truncate">${esc(c.author)} · ${esc(new Date(c.date).toLocaleString())}</span>
                <button class="ml-auto text-gh-muted hover:text-gh-text p-0.5" data-modal-close title="Close">

        function buildStatBar(adds, dels) {

        function pairLines(lines) {
          const pairs = [];

        function parseHunkHeader(header) {

                const text = commentRow.querySelector("textarea").value.trim();
                const images = imgHandler ? imgHandler.getImages() : [];
                if (text || images.length) {
                  onSave(text, images);
                  renderSaved();
                } else {
                  commentRow.remove();
                }
                clearHighlight();
                updateCommentCount();
              } else if (action === "delete") {
                if (onDelete) onDelete();
                annotations.delete(key);
                commentRow.remove();
                clearHighlight();
                updateCommentCount();
              } else if (action === "cancel") {
                if (annotations.has(key)) {
                  renderSaved();
                } else {
                  commentRow.remove();
                }
                clearHighlight();
              } else if (action === "edit") {
                commentRow.remove();
                onEdit();
              }
            });
          }

          // --- Line-level comments ---
          function extractSnippet(diffRow, side, fromLine, toLine) {
            const file = diffRow.closest(".diff-file");
            if (!file) return "";
            const sideAttr = side === "left" ? "left" : "right";
            const rows = file.querySelectorAll(".diff-row");
            const lines = [];
            for (const row of rows) {
              const lineNumEl = row.querySelector(`.diff-linenum[data-side="${sideAttr}"]`);
              if (!lineNumEl || lineNumEl.classList.contains("empty")) continue;
              const num = parseInt(lineNumEl.dataset.line, 10);
              if (isNaN(num) || num < fromLine || num > toLine) continue;
              // In split view, code is 2nd child of the side container
              const sideEl = row.querySelector(`[data-side-type="${sideAttr}"]`);
              let text = "";
              if (sideEl) {
                const codeEl = sideEl.children[1];
                text = codeEl ? codeEl.textContent : "";
              } else {
                // Unified view: last child of the row is the code cell
                const children = row.children;
                text = children.length ? children[children.length - 1].textContent : "";
              }
              lines.push(text);
            }
            return lines.join("\n");
          }

          function showCommentForm(diffRow, side, lineNumEl, fromLine, toLine) {
            const fileName = diffRow.dataset.file;
            if (fromLine == null) {
              fromLine = parseInt(lineNumEl.dataset.line, 10) || 0;
              toLine = fromLine;
            }
            const lineLabel = fromLine === toLine ? `${fromLine}` : `${fromLine}-${toLine}`;
            const sideLabel = side === "left" ? ` (${currentDiffData.resolvedRef})` : "";
            const key = `${fileName}:${lineLabel}:${side}`;
            const label = `${esc(fileName)} line${fromLine !== toLine ? "s" : ""} ${lineLabel}${sideLabel}`;
            const snippet = extractSnippet(diffRow, side, fromLine, toLine);

            createCommentRow({
              key,
              label,
              side,
              anchorEl: diffRow,
              onSave: (text, images) => {
                annotations.set(key, {
                  file: fileName,
                  fromLine,
                  toLine,
                  side,
                  text,
                  images,
                  snippet,
                });
                if (lineNumEl)
                  lineNumEl.classList.add("has-comment", "border-l-[3px]", "border-l-gh-accent");
              },
              onDelete: () => {
                if (lineNumEl)
                  lineNumEl.classList.remove("has-comment", "border-l-[3px]", "border-l-gh-accent");
              },
              onEdit: () => showCommentForm(diffRow, side, lineNumEl, fromLine, toLine),
            });
          }

          // --- File-level comments ---
          function showFileComment(fileName, headerEl) {
            const key = `${fileName}:file:file`;
            const label = `${esc(fileName)} (file comment)`;

            createCommentRow({
              key,
              label,
              side: "file",
              anchorEl: headerEl,
              onSave: (text, images) => {
                annotations.set(key, {
                  file: fileName,
                  fromLine: 0,
                  toLine: 0,
                  side: "file",
                  type: "file",
                  text,
                  images,
                });
              },
              onEdit: () => showFileComment(fileName, headerEl),
            });
          }

          // --- Rich markdown block annotations ---
          const RICH_BLOCK_TAGS = new Set([
            "H1",
            "H2",
            "H3",
            "H4",
            "H5",
            "H6",
            "P",
            "LI",
            "BLOCKQUOTE",
            "PRE",
            "TABLE",
            "HR",
          ]);
          function instrumentRichBlocks(richEl, fileName) {
            if (!richEl || submitted) return;
            const blocks = [];
            for (const child of richEl.children) {
              if (RICH_BLOCK_TAGS.has(child.tagName)) {
                blocks.push(child);
              } else if (child.tagName === "UL" || child.tagName === "OL") {
                // Add each LI individually
                for (const li of child.children) {
                  if (li.tagName === "LI") blocks.push(li);
                }
              }
            }
            function richBlockLabel(block, idx, fName) {
              const heading = block.tagName.match(/^H[1-6]$/) ? block.textContent.trim() : "";
              return heading ? `${esc(fName)} — ${esc(heading)}` : `${esc(fName)} block ${idx + 1}`;
            }

            function openRichComment(blk, bIdx, fName) {
              const snippet = blk.textContent.trim().slice(0, 200);
              const blockKey = `${fName}:block-${bIdx}:rich`;
              const blockLabel = richBlockLabel(blk, bIdx, fName);

              createCommentRow({
                key: blockKey,
                label: blockLabel,
                side: "file",
                anchorEl: blk,
                onSave: (text, images) => {
                  annotations.set(blockKey, {
                    file: fName,
                    fromLine: 0,
                    toLine: 0,
                    side: "rich",
                    type: "rich",
                    blockIndex: bIdx,
                    text,
                    images,
                    snippet,
                  });
                  blk.classList.add("has-comment");
                },
                onDelete: () => {
                  blk.classList.remove("has-comment");
                },
                onEdit: () => {
                  openRichComment(blk, bIdx, fName);
                },
              });
            }

            blocks.forEach((block, idx) => {
              block.classList.add("rich-block");
              block.dataset.richBlock = idx;
              block.dataset.richFile = fileName;

              const key = `${fileName}:block-${idx}:rich`;
              if (annotations.has(key)) {
                block.classList.add("has-comment");
                createCommentRow({
                  key,
                  label: richBlockLabel(block, idx, fileName),
                  side: "file",
                  anchorEl: block,
                  savedOnly: true,
                  onSave: () => {},
                  onDelete: () => {
                    block.classList.remove("has-comment");
                  },
                  onEdit: () => {
                    openRichComment(block, idx, fileName);
                  },
                });
              }

              block.addEventListener("click", (e) => {
                if (submitted) return;
                if (e.target.closest("a")) return;
                openRichComment(block, idx, fileName);
              });
            });
          }

          targetEl.addEventListener("click", async (e) => {
            const expandBar = e.target.closest(".expand-bar");
            if (expandBar) {
              const { expandFile, expandFromOld, expandToOld, expandFromNew, expandToNew } =
                expandBar.dataset;
              const fromNew = parseInt(expandFromNew, 10);
              const toNew = parseInt(expandToNew, 10);
              if (isNaN(fromNew) || isNaN(toNew) || toNew < fromNew) return;
              expandBar.innerHTML = `${EXPAND_ICON}<span class="font-mono">Loading...</span>`;
              try {
                const res = await fetch(
                  `/api/context?file=${encodeURIComponent(expandFile)}&start=${fromNew}&end=${toNew}`,
                );
                const data = await res.json();
                if (!data.lines) return;
                const lang = langFromFile(expandFile);
                let rowsHtml = "";
                for (let i = 0; i < data.lines.length; i++) {
                  const oldNum = parseInt(expandFromOld, 10) + i;
                  const newNum = fromNew + i;
                  const code = data.lines[i];
                  const highlighted = highlightCode(code, lang);
                  const content = `<span class="select-none text-gh-muted"> </span>${highlighted}`;
                  if (viewMode === "split") {
                    rowsHtml += `<div class="diff-row flex border-b border-gh-borderSubtle" data-file="${esc(expandFile)}" data-left="${oldNum}" data-right="${newNum}">`;
                    rowsHtml += `<div class="diff-side flex flex-1 min-w-0 border-r border-gh-border" data-side-type="left">`;
                    rowsHtml += `<div class="diff-linenum bg-gh-surface ${LINENUM_CLASSES}" data-side="left" data-line="${oldNum}">${oldNum}</div>`;
                    rowsHtml += `<div class="${CODE_CLASSES}">${content}</div>`;
                    rowsHtml += `</div>`;
                    rowsHtml += `<div class="diff-side flex flex-1 min-w-0" data-side-type="right">`;
                    rowsHtml += `<div class="diff-linenum bg-gh-surface ${LINENUM_CLASSES}" data-side="right" data-line="${newNum}">${newNum}</div>`;
                    rowsHtml += `<div class="${CODE_CLASSES}">${content}</div>`;
                    rowsHtml += `</div></div>`;
                  } else {
                    rowsHtml += `<div class="diff-row flex border-b border-gh-borderSubtle" data-file="${esc(expandFile)}" data-left="${oldNum}" data-right="${newNum}">`;
                    rowsHtml += `<div class="diff-linenum bg-gh-surface ${LINENUM_CLASSES}" data-side="left" data-line="${oldNum}">${oldNum}</div>`;
                    rowsHtml += `<div class="diff-linenum bg-gh-surface ${LINENUM_CLASSES}" data-side="right" data-line="${newNum}">${newNum}</div>`;
                    rowsHtml += `<div class="${CODE_CLASSES}">${content}</div></div>`;
                  }
                }
                const container = document.createElement("div");
                container.innerHTML = rowsHtml;
                expandBar.replaceWith(...container.children);
              } catch {
                expandBar.innerHTML = `${EXPAND_ICON}<span class="font-mono text-gh-delFg">Failed to load</span>`;
              }
              return;
            }

            const collapseBtn = e.target.closest("[data-collapse]");
            if (collapseBtn) {
              const fileEl = collapseBtn.closest(".diff-file");
              if (!fileEl) return;
              const content = fileEl.querySelector(".diff-file-content");
              if (!content) return;
              const isCollapsed = content.classList.contains("collapsed");
              content.classList.toggle("collapsed");
              const svg = collapseBtn.querySelector("svg");
              if (svg) svg.style.transform = isCollapsed ? "" : "rotate(-90deg)";
              return;
            }

            const copyBtn = e.target.closest("[data-copy-diff]");
            if (copyBtn) {
              const fileName = copyBtn.dataset.copyDiff;
              const chunks = currentDiffData.patch.split(/(?=^diff --git )/m);
              const fileDiff =
                chunks.find((c) => c.includes(`a/${fileName}`) || c.includes(`b/${fileName}`)) ||
                "";
              navigator.clipboard.writeText(fileDiff.trim());
              copyBtn.style.color = "var(--color-green)";
              setTimeout(() => {
                copyBtn.style.color = "";
              }, 1000);
              return;
            }

            const openBtn = e.target.closest("[data-open-file]");
            if (openBtn) {
              openInEditor(openBtn.dataset.openFile, 1);
              return;
            }

            const richToggle = e.target.closest("[data-rich-toggle]");
            if (richToggle) {
              const fileName = richToggle.dataset.richToggle;
              const fileEl = richToggle.closest(".diff-file");
              if (!fileEl) return;
              const content = fileEl.querySelector(".diff-file-content");
              const inner = content?.querySelector(".diff-content-inner");
              if (!inner) return;
              const isRich = richToggle.dataset.richActive === "true";
              if (isRich) {
                // Switch back to code diff
                richToggle.dataset.richActive = "false";
                richToggle.innerHTML = RICH_DIFF_ICON;
                richToggle.title = "Display rich diff";
                richToggle.classList.remove("text-gh-text");
                richToggle.classList.add("text-gh-muted");
                const cached = inner._codeDiffHTML;
                if (cached) inner.innerHTML = cached;
              } else {
                // Switch to rich diff
                inner._codeDiffHTML = inner._codeDiffHTML || inner.innerHTML;
                richToggle.dataset.richActive = "true";
                richToggle.innerHTML = CODE_DIFF_ICON;
                richToggle.title = "Display source diff";
                richToggle.classList.remove("text-gh-muted");
                richToggle.classList.add("text-gh-text");
                inner.innerHTML =
                  '<div class="rich-diff-content"><p class="text-gh-muted text-[13px]">Loading...</p></div>';
                fetch(`/api/file-versions?file=${encodeURIComponent(fileName)}`)
                  .then((r) => r.json())
                  .then((data) => {
                    if (richToggle.dataset.richActive !== "true") return;
                    const newContent = data.new || "";
                    const oldContent = data.old || "";
                    const isNewFile = !oldContent;
                    function rewriteImgSrc(htmlStr) {
                      const dir = fileName.includes("/") ? fileName.replace(/\/[^/]+$/, "/") : "";
                      return htmlStr.replace(
                        /(<img\s[^>]*?\bsrc=["'])([^"']+)(["'])/gi,
                        (m, pre, src, post) => {
                          if (
                            src.startsWith("http://") ||
                            src.startsWith("https://") ||
                            src.startsWith("data:") ||
                            src.startsWith("/")
                          )
                            return m;
                          const resolved = new URL(src, `http://x/${dir}__anchor__`).pathname
                            .slice(1)
                            .replace("__anchor__", "");
                          return pre + `/api/raw-file?file=${encodeURIComponent(resolved)}` + post;
                        },
                      );
                    }
                    const mdContent = newContent.replace(/^---\n[\s\S]*?\n---\n?/, "");
                    const html = rewriteImgSrc(DOMPurify.sanitize(marked.parse(mdContent)));
                    if (isNewFile) {
                      inner.innerHTML = `<div class="rich-diff-content rich-diff-added">${html}</div>`;
                    } else {
                      inner.innerHTML = `<div class="rich-diff-content">${html}</div>`;
                    }
                    instrumentRichBlocks(inner.querySelector(".rich-diff-content"), fileName);
                  })
                  .catch((err) => {
                    inner.innerHTML = `<div class="rich-diff-content"><p class="text-gh-muted text-[13px]">Failed to load rich diff.${err?.message ? " " + esc(err.message) : ""}</p></div>`;
                  });
              }
              return;
            }

            const viewedCb = e.target.closest(".viewed-checkbox");
            if (viewedCb) {
              const fileName = viewedCb.dataset.viewed;
              setViewed(fileName, viewedCb.checked);
              const fileEl = viewedCb.closest(".diff-file");
              if (fileEl) {
                const content = fileEl.querySelector(".diff-file-content");
                const svg = fileEl.querySelector(".collapse-btn svg");
                if (content) {
                  if (viewedCb.checked) content.classList.add("collapsed");
                  else content.classList.remove("collapsed");
                  if (svg) svg.style.transform = viewedCb.checked ? "rotate(-90deg)" : "";
                }
              }
              return;
            }

            const commentBtn = e.target.closest("[data-file-comment]");
            if (commentBtn && !submitted) {
              const fileName = commentBtn.dataset.fileComment;
              const headerEl = commentBtn.closest(".diff-file-header");
              if (headerEl) showFileComment(fileName, headerEl);
            }
          });

          // --- Multi-line selection ---
          let dragState = null;
          let highlightedEls = [];

          function getDiffRowsInRange(startRow, endRow) {
            const file = startRow.closest(".diff-file");
            if (!file) return [];
            const allRows = Array.from(file.querySelectorAll(".diff-row"));
            const si = allRows.indexOf(startRow);
            const ei = allRows.indexOf(endRow);
            if (si === -1 || ei === -1) return [];
            return allRows.slice(Math.min(si, ei), Math.max(si, ei) + 1);
          }

          function clearHighlight() {
            for (const el of highlightedEls) el.classList.remove("side-select-range");
            highlightedEls = [];
          }

          function highlightSide(rows, side) {
            clearHighlight();
            for (const r of rows) {
              const sideEl = r.querySelector(`[data-side-type="${side}"]`);
              if (sideEl) {
                sideEl.classList.add("side-select-range");
                highlightedEls.push(sideEl);
              }
            }
          }

          targetEl.addEventListener("mousedown", (e) => {
            if (submitted) return;
            const lineNum = e.target.closest(".diff-linenum");
            if (!lineNum || lineNum.classList.contains("empty")) return;

            const diffRow = lineNum.closest(".diff-row");
            if (!diffRow) return;

            const side = lineNum.dataset.side;
            const line = parseInt(lineNum.dataset.line, 10);
            if (isNaN(line)) return;

            const file = diffRow.closest(".diff-file");
            const allRows = file ? Array.from(file.querySelectorAll(".diff-row")) : [];
            dragState = {
              startRow: diffRow,
              startLine: line,
              side,
              startLineNum: lineNum,
              allRows,
            };
            highlightSide([diffRow], side);
            e.preventDefault();
          });

          targetEl.addEventListener("mousemove", (e) => {
            if (!dragState) return;
            const lineNum = e.target.closest(".diff-linenum");
            if (!lineNum || lineNum.classList.contains("empty")) return;
            if (lineNum.dataset.side !== dragState.side) return;
            const diffRow = lineNum.closest(".diff-row");
            if (!diffRow) return;
            // Use cached allRows from mousedown
            const { allRows } = dragState;
            const si = allRows.indexOf(dragState.startRow);
            const ei = allRows.indexOf(diffRow);
            if (si === -1 || ei === -1) return;
            const rows = allRows.slice(Math.min(si, ei), Math.max(si, ei) + 1);
            highlightSide(rows, dragState.side);
          });

          document.addEventListener(
            "mouseup",
            (e) => {
              if (!dragState) return;
              const { startRow, startLine, side, startLineNum } = dragState;
              dragState = null;

              let endLine = startLine;
              let endRow = startRow;
              const lineNum = e.target.closest(".diff-linenum");
              if (
                lineNum &&
                !lineNum.classList.contains("empty") &&
                lineNum.dataset.side === side
              ) {
                endRow = lineNum.closest(".diff-row");
                endLine = parseInt(lineNum.dataset.line, 10) || startLine;
              }

              const fromLine = Math.min(startLine, endLine);
              const toLine = Math.max(startLine, endLine);
              const lastRow = endLine >= startLine ? endRow : startRow;
              const rangeRows = getDiffRowsInRange(startRow, endRow);
              highlightSide(rangeRows, side);
              showCommentForm(lastRow, side, startLineNum, fromLine, toLine);
            },
            docSignal,
          );

          // --- Submit ---
          function updateCommentCount() {
            const n = annotations.size;
            const text = `${n} comment${n !== 1 ? "s" : ""}`;
            document.getElementById("comment-count").textContent = text;
            document.getElementById("comment-count-bottom").textContent = text;
          }

          const generalImgHandler = setupImageSupport(
            document.getElementById("general-comment-section"),
          );

          document.getElementById("btn-cancel").addEventListener("click", () => {
            if (submitted) return;
            submitted = true;
            fetch("/api/feedback", {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({
                annotations: [],
                generalComment: "",
                approved: false,
                cancelled: true,
              }),
            }).catch(() => {});
            app.innerHTML = renderEndScreen("Review cancelled", true);
          });
          document.getElementById("btn-approve").addEventListener("click", () => submit(true));
          document.getElementById("btn-submit").addEventListener("click", () => submit(false));

          document.addEventListener(
            "keydown",
            (e) => {
              if (e.key === "Enter" && (e.metaKey || e.ctrlKey) && !submitted) {
                if (!document.activeElement?.closest("[data-comment-key]")) submit(false);
              }
            },
            docSignal,
          );

          async function submit(approved) {
            if (submitted) return;
            submitted = true;
            const payload = {
              annotations: Array.from(annotations.values()),
              generalComment: document.getElementById("general-comment")?.value?.trim() || "",
              generalImages: generalImgHandler.getImages(),
              approved,
            };
            try {
              await fetch("/api/feedback", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify(payload),
              });
            } catch {}
            app.innerHTML = renderEndScreen(approved ? "Changes approved" : "Feedback sent");
          }

          restoreAnnotations();
          mountJumpButton();
          updateViewedCount();
        } // end renderDiffView

        // --- Loading state ---
        app.innerHTML = `<div class="flex items-center justify-center min-h-screen">
          <div class="text-center">
            <div class="w-6 h-6 border-2 border-gh-border border-t-gh-text rounded-full mx-auto mb-4 animate-spin"></div>
            <p class="text-[13px] text-gh-muted">Loading diff...</p>
          </div>
        </div>`;

        // The commit list comes first because the default selection depends on it:
        // just the working tree when it has changes, otherwise every commit.
        // flow: page load — reviewer opens linemark in the browser
        fetch("/api/commits")
          .then((r) => r.json())
          .catch(() => [])
          .then((commitList) => {
            commits = commitList;
            if (bootstrap.hasWorktreeChanges) {
              worktreeSelected = true;
            } else {
              for (const c of commits) selectedCommits.add(c.hash);
            }
            return fetchSelectionDiff();
          });
      })();
    </script>
  </body>
</html>
